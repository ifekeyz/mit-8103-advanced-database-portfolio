# Portfolio 4: local MongoDB for NairaPay (coursework only, not for real data).
# Start:  docker compose -f portfolio-4-nosql/docker-compose.yml up -d
# Stop:   docker compose -f portfolio-4-nosql/docker-compose.yml down        (keeps data)
# Reset:  docker compose -f portfolio-4-nosql/docker-compose.yml down -v     (deletes data)
services:
  mongo:
    image: mongo:7
    container_name: nairapay-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: nairapay_user
      MONGO_INITDB_ROOT_PASSWORD: nairapay_pass   # local demo password only
    volumes:
      - nairapay_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nairapay_mongo_data: